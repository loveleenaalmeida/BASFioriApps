# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: customer.porky.zpgcustbudget
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DE2
          url: http://pkynj-de2app.porkyproducts.loc:8000
          client: '100'
        app:
          name: ZPGCUSTBUDGET
          description: PG Customer Budget 
          package: Z001
          transport: DE2K906541
        exclude:
          - /test/
