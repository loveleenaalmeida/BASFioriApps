# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: customer.porky.zlaterordersodata
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DEV
          url: http://pkytx-devapp.porkyproducts.loc:8000
          client: '100'
        app:
          name: ZLATEORDERSO
          description: Late Orders Odata
          package: ZKPI
          transport: DEVK915682
        exclude:
          - /test/
          - /localService/
